name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: build.cmd

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenDimmer
          path: ScreenDimmer.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ScreenDimmer.exe --clobber
          else
            gh release create "$GITHUB_REF_NAME" ScreenDimmer.exe --title "Screen Dimmer $GITHUB_REF_NAME" --generate-notes
          fi
